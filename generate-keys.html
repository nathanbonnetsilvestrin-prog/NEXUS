<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS - Générateur de clés</title>
</head>
<body>
<h2>NEXUS — Générateur de clés</h2>
<p>Les clés sont générées directement dans ton navigateur.</p>
<button id="generate">Générer les clés</button>
<pre id="output"></pre>

<script>
const toB64Url = bytes =>
  btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");

document.querySelector("#generate").onclick = async () => {
  const pair = await crypto.subtle.generateKey(
    { name: "ECDSA", namedCurve: "P-256" },
    true,
    ["sign", "verify"]
  );

  const publicKey = new Uint8Array(
    await crypto.subtle.exportKey("raw", pair.publicKey)
  );

  const privateKey = await crypto.subtle.exportKey("jwk", pair.privateKey);

  document.querySelector("#output").textContent =
    "VAPID_PUBLIC_KEY=" + toB64Url(publicKey) +
    "\n\nVAPID_PRIVATE_KEY=" + privateKey.d;
};
</script>
</body>
</html>
