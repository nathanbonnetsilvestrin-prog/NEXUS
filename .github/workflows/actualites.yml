
name: Actualites NEXUS

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer Argos Translate
        run: |
          python -m pip install --upgrade pip
          pip install argostranslate
      - name: Installer le modèle anglais-français
        run: |
          python -c "import argostranslate.package; argostranslate.package.update_package_index(); packages = argostranslate.package.get_available_packages(); package = next(p for p in packages if p.from_code == 'en' and p.to_code == 'fr'); argostranslate.package.install_from_path(package.download())"

      - name: Recuperer les actualites
        run: python update_news.py

      - name: Enregistrer les actualites
        run: |
          git config user.name "NEXUS Bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Actualisation des actualites"
          git push
