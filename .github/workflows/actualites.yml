
name: Actualites NEXUS

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recuperer les actualites
        run: python update_news.py

      - name: Enregistrer les actualites
        run: |
          git config user.name "NEXUS Bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Actualisation des actualites"
          git push
